services:
  db:
    image: postgres:16-alpine
    container_name: literacy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: literacy
    ports:
      - "5432:5432"
    volumes:
      - literacy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d literacy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  literacy_pgdata:
